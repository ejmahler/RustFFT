[package]

name = "rustfft"
version = "6.4.1"
authors = ["Allen Welkie <allen.welkie at gmail>", "Elliott Mahler <join.together at gmail>"]
edition = "2021"
rust-version = "1.80"

description = "High-performance FFT library written in pure Rust."
documentation = "https://docs.rs/rustfft/"
repository = "https://github.com/ejmahler/RustFFT"
keywords = ["fft", "dft", "discrete", "fourier", "transform"]
categories = ["algorithms", "compression", "multimedia::encoding", "science"]
license = "MIT OR Apache-2.0"

[features]
default = ["avx", "sse", "neon"]

# On x86_64, the "avx" feature enables compilation of AVX-acclerated code. 
# Similarly, the "sse" feature enables compilation of SSE-accelerated code. 
# Enabling these improves performance if the client CPU supports AVX or SSE, while disabling them reduces compile time and binary size.
# If both are enabled, RustFFT will use AVX if the CPU supports it. If not, it will check for SSE4.1.
# If neither instruction set is available, it will fall back to the scalar code.  
#
# On AArch64, the "neon" feature enables compilation of Neon-accelerated code.
# Also on AArch64, the "fcma" feature enables compilation of code using the FCMA (floating point complex
# multiply accumulate) instructions from ARMv8.3-A. This requires a nightly compiler, since the intrinsics
# are still unstable. It is used instead of the plain Neon code when the CPU supports it.
#
# On wasm32, the "wasm_simd" feature enables compilation of Wasm SIMD accelerated code.
#
# For all of the above features, on every platform other than the intended platform for the feature, these features do nothing, and RustFFT will behave like they are not set.
avx = []
sse = []
neon = []
fcma = []
wasm_simd = []


[dependencies]
num-complex = "0.4"
num-traits = "0.2"
num-integer = "^0.1.40"
strength_reduce = "0.2.4"
transpose = "0.2"
primal-check = "0.3.3"

[dev-dependencies]
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
wasm-bindgen-test = "^0.3.36"

criterion = { version = "0.8", default-features = false }

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi", target_env = "p2"))'.dev-dependencies]
getrandom = "=0.3.1"

[[bench]]
name = "bench_check_neon"
harness = false

[[bench]]
name = "bench_check_scalar"
harness = false

[[bench]]
name = "bench_check_sse"
harness = false

[[bench]]
name = "bench_compare_scalar_neon"
harness = false

[[bench]]
name = "bench_compare_scalar_sse_avx"
harness = false

[[bench]]
name = "bench_compare_scalar_wasm_simd"
harness = false

[[bench]]
name = "bench_rustfft"
harness = false

[[bench]]
name = "bench_rustfft_neon"
harness = false

[[bench]]
name = "bench_rustfft_scalar"
harness = false

[[bench]]
name = "bench_rustfft_sse"
harness = false

[[bench]]
name = "bench_rustfft_wasm_simd"
harness = false

[[bench]]
name = "compare_3n2m_strategies"
harness = false

# Compares the Neon and FCMA backends against each other. Needs the nightly-only "fcma" feature,
# and a CPU implementing ARMv8.3-A:
#   cargo +nightly bench --features fcma --bench bench_compare_neon_fcma
[[bench]]
name = "bench_compare_neon_fcma"
required-features = ["fcma"]
harness = false
